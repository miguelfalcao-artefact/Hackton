name: ecommerce-mock

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop} -d ${POSTGRES_DB:-shop}"]
      interval: 5s
      timeout: 4s
      retries: 24
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_NAME: ecommerce-api
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@postgres:5432/${POSTGRES_DB:-shop}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /var/log/app
      SEED_ON_START: ${SEED_ON_START:-true}
      RESET_ON_START: ${RESET_ON_START:-false}
      PAYMENT_DECLINE_ABOVE_CENTS: ${PAYMENT_DECLINE_ABOVE_CENTS:-500000}
      RATE_LIMIT_FREE_PER_MIN: ${RATE_LIMIT_FREE_PER_MIN:-60}
      RATE_LIMIT_PRO_PER_MIN: ${RATE_LIMIT_PRO_PER_MIN:-600}
      RATE_LIMIT_ENTERPRISE_PER_MIN: ${RATE_LIMIT_ENTERPRISE_PER_MIN:-6000}
      API_KEYS: ${API_KEYS:-acme-retail:acme-retail-key:enterprise,bolt-shop:bolt-shop-key:pro,quickcart:quickcart-key:free,nightowl-bot:nightowl-bot-key:free}
    ports:
      - "${API_PORT:-8100}:8000"
    volumes:
      # The sink the app writes, bind-mounted so the very same api.jsonl is
      # readable from the host without `docker cp`, and survives `down`.
      - ./logs:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
